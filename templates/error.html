{% extends 'base.html' %}{% block title %}Notice {{ code }} - MunchBite{% endblock %}
{% block content %}
<div class="card form-narrow" style="text-align:center; padding:3rem 1.8rem; box-shadow:var(--shadow-sm)">
  <h2 style="font-size:2.2rem; margin-bottom:0.5rem">{{ code }}</h2>
  <p style="color:var(--text-body); margin-bottom:1.8rem; line-height:1.6">{{ message }}</p>
  <a class="btn" href="{{ url_for('shop.index') }}">Return to Homepage</a>
</div>
{% endblock %}
