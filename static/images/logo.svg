<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" role="img" aria-label="MunchBite Food Delivery">
  <defs>
    <linearGradient id="fullLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B55" />
      <stop offset="55%" stop-color="#E23744" />
      <stop offset="100%" stop-color="#B81423" />
    </linearGradient>
    <linearGradient id="fullLogoAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E23744" />
      <stop offset="100%" stop-color="#FF9F1C" />
    </linearGradient>
    <radialGradient id="fullCoreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E44" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E23744" stop-opacity="0.05" />
    </radialGradient>
    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E23744" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: The Iconic AI Gastronomy Star Emblem (scaled to fit 56x56) -->
  <g transform="translate(32 32) scale(0.56) translate(-50 -50)">
    <circle cx="50" cy="50" r="14" fill="url(#fullCoreAura)" />
    <g filter="url(#fullGlow)">
      <rect x="46.25" y="4" width="7.5" height="32" rx="3.75" fill="url(#fullLogoGrad)" />
      <rect x="46.25" y="4" width="7.5" height="32" rx="3.75" transform="rotate(90 50 50)" fill="url(#fullLogoGrad)" />
      <rect x="46.25" y="4" width="7.5" height="32" rx="3.75" transform="rotate(180 50 50)" fill="url(#fullLogoGrad)" />
      <rect x="46.25" y="4" width="7.5" height="32" rx="3.75" transform="rotate(270 50 50)" fill="url(#fullLogoGrad)" />

      <rect x="46.6" y="9" width="6.8" height="27" rx="3.4" transform="rotate(45 50 50)" fill="url(#fullLogoAccent)" />
      <rect x="46.6" y="9" width="6.8" height="27" rx="3.4" transform="rotate(135 50 50)" fill="url(#fullLogoAccent)" />
      <rect x="46.6" y="9" width="6.8" height="27" rx="3.4" transform="rotate(225 50 50)" fill="url(#fullLogoAccent)" />
      <rect x="46.6" y="9" width="6.8" height="27" rx="3.4" transform="rotate(315 50 50)" fill="url(#fullLogoAccent)" />

      <rect x="47" y="14" width="6.0" height="22" rx="3.0" transform="rotate(30 50 50)" fill="url(#fullLogoGrad)" />
      <rect x="47" y="14" width="6.0" height="22" rx="3.0" transform="rotate(60 50 50)" fill="url(#fullLogoGrad)" />
      <rect x="47" y="14" width="6.0" height="22" rx="3.0" transform="rotate(120 50 50)" fill="url(#fullLogoGrad)" />
      <rect x="47" y="14" width="6.0" height="22" rx="3.0" transform="rotate(150 50 50)" fill="url(#fullLogoGrad)" />
      <rect x="47" y="14" width="6.0" height="22" rx="3.0" transform="rotate(210 50 50)" fill="url(#fullLogoGrad)" />
      <rect x="47" y="14" width="6.0" height="22" rx="3.0" transform="rotate(240 50 50)" fill="url(#fullLogoGrad)" />
      <rect x="47" y="14" width="6.0" height="22" rx="3.0" transform="rotate(300 50 50)" fill="url(#fullLogoGrad)" />
      <rect x="47" y="14" width="6.0" height="22" rx="3.0" transform="rotate(330 50 50)" fill="url(#fullLogoGrad)" />
    </g>
    <circle cx="50" cy="50" r="5" fill="#FFFFFF" />
    <circle cx="50" cy="50" r="2.5" fill="#FFD166" />
  </g>

  <!-- Right: Custom Branded Typography -->
  <text x="68" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.8" fill="#FFFFFF">
    Munch<tspan fill="#E23744">Bite</tspan>
  </text>
  <text x="69" y="52" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="9" letter-spacing="1.8" fill="#94A3B8">
    FOOD DELIVERY &bull; AI
  </text>
</svg>
